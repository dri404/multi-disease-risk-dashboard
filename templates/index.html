<!DOCTYPE html>
<html>
<head>
    <title>Disease Predictor</title>
</head>
<body style="text-align:center; font-family:Arial;">
    <h1>🩺 Disease Risk Predictor</h1>

    <form action="/predict" method="post">
        <input type="text" name="f1" placeholder="Feature 1" required><br><br>
        <input type="text" name="f2" placeholder="Feature 2" required><br><br>
        <input type="text" name="f3" placeholder="Feature 3" required><br><br>
        <input type="text" name="f4" placeholder="Feature 4" required><br><br>
        <input type="text" name="f5" placeholder="Feature 5" required><br><br>

        <button type="submit">Predict</button>
    </form>

    <h2>{{ prediction_text }}</h2>
</body>
</html>
